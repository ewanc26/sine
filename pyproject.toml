[project]
name = "sine"
version = "0.1.0"
description = "An LLM-powered music recommendation system built around listening history."
readme = "README.md"
authors = [{ name = "Ewan Croft (ewanc26)" }]
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1,<1",
    "pydantic>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.17.5,<1",
]

[project.scripts]
sine = "sine.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"
