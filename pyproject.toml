[project]
name = "sine"
version = "0.1.0"
description = "An LLM-powered music recommendation system built around listening history."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.14,<1",
]

[project.scripts]
sine = "sine.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
